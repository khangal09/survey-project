<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход и регистрация на сайте «Статопрос».">
    <meta name="theme-color" content="#0f766e">
    <title>Вход — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html" aria-label="Статопрос — главная страница">
                <img src="logo.svg" alt="Статопрос" width="160" height="40">
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html">Опросы</a></li>
                    <li><a class="nav__link" href="create.html">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                    <li><a class="nav__link" href="login.html" id="auth-link" aria-current="page">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div class="container">
            <section class="content-section" aria-labelledby="page-title">
                <h1 id="page-title">Вход и регистрация</h1>
                <p class="section-description">Войдите в аккаунт или создайте новый, чтобы публиковать опросы.</p>
            </section>

            <div class="two-col">
                <section class="panel" aria-labelledby="login-title">
                    <h2 id="login-title">Вход</h2>
                    <form id="login-form">
                        <div class="field">
                            <label for="login-username">Имя пользователя</label>
                            <input type="text" id="login-username" name="username" autocomplete="username" required>
                        </div>
                        <div class="field">
                            <label for="login-password">Пароль</label>
                            <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn" type="submit">Войти</button>
                    </form>
                </section>

                <section class="panel" aria-labelledby="register-title">
                    <h2 id="register-title">Регистрация</h2>
                    <form id="register-form">
                        <div class="field">
                            <label for="reg-username">Имя пользователя (3–30 символов)</label>
                            <input type="text" id="reg-username" name="username" autocomplete="username" minlength="3" maxlength="30" pattern="[\w.\-]+" title="Буквы, цифры, точка, дефис и подчёркивание" required>
                        </div>
                        <div class="field">
                            <label for="reg-password">Пароль (минимум 6 символов)</label>
                            <input type="password" id="reg-password" name="password" autocomplete="new-password" minlength="6" maxlength="72" required>
                        </div>
                        <button class="btn" type="submit">Зарегистрироваться</button>
                    </form>
                </section>
            </div>

            <p id="auth-message" class="status" role="status" aria-live="polite" style="text-align: center;"></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос». Учебный проект.</p></div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
