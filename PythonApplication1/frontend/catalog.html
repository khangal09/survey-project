<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог опросов на сайте «Статопрос». Найдите интересующий опрос по названию или рубрике.">
    <meta name="theme-color" content="#0f766e">
    <title>Все опросы — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html" aria-label="Статопрос — главная страница">
                <img src="logo.svg" alt="Статопрос" width="160" height="40">
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html" aria-current="page">Опросы</a></li>
                    <li><a class="nav__link" href="create.html">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                    <li><a class="nav__link" href="login.html" id="auth-link">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div class="container">
            <section class="content-section" aria-labelledby="page-title">
                <h1 id="page-title">Все опросы</h1>
                <p class="section-description">Выберите интересующий опрос и оставьте свой ответ.</p>
            </section>

            <section class="panel" aria-labelledby="filter-title">
                <h2 id="filter-title">Поиск и сортировка</h2>
                <form class="form-grid" id="filter-form" role="search">
                    <div class="field">
                        <label for="q">Название содержит</label>
                        <input type="search" id="q" name="q" placeholder="Например, язык">
                    </div>
                    <div class="field">
                        <label for="category">Рубрика</label>
                        <select id="category" name="category">
                            <option value="">Все рубрики</option>
                            <option value="study">Учёба</option>
                            <option value="life">Быт</option>
                            <option value="leisure">Досуг</option>
                            <option value="tech">Технологии</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sort">Сортировать</label>
                        <select id="sort" name="sort">
                            <option value="new">Сначала новые</option>
                            <option value="popular">Сначала популярные</option>
                            <option value="title">По названию</option>
                        </select>
                    </div>
                </form>
            </section>

            <section aria-labelledby="list-title">
                <h2 id="list-title">Список опросов</h2>
                <ul class="cards" id="survey-cards" aria-live="polite">
                    <li class="state-msg">Загрузка опросов...</li>
                </ul>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос». Учебный проект.</p></div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
