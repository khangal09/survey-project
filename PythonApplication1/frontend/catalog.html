<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог опросов: ищите по названию, фильтруйте по рубрике.">
    <title>Все опросы — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html"><img src="logo.svg" alt="Статопрос" width="160" height="40"></a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html" aria-current="page">Опросы</a></li>
                    <li><a class="nav__link" href="survey.html">Пример опроса</a></li>
                    <li><a class="nav__link" href="create.html">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div class="container">
            <h1>Все опросы</h1>
            <p>Выберите опрос и оставьте свой ответ.</p>

            <!-- Форма поиска и сортировки -->
            <section class="panel" style="margin-top: 2rem;">
                <h2>Поиск и сортировка</h2>
                <form class="form-grid" id="filter-form">
                    <div class="field">
                        <label for="q">Название содержит</label>
                        <input type="search" id="q" name="q" placeholder="Например, расписание">
                    </div>
                    <div class="field">
                        <label for="category">Рубрика</label>
                        <select id="category" name="category">
                            <option value="">Все рубрики</option>
                            <option value="study">Учёба</option>
                            <option value="life">Быт</option>
                            <option value="leisure">Досуг</option>
                            <option value="tech">Технологии</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sort">Сортировать</label>
                        <select id="sort" name="sort">
                            <option value="new">Сначала новые</option>
                            <option value="popular">Сначала популярные</option>
                            <option value="title">По названию</option>
                        </select>
                    </div>
                </form>
            </section>

            <!-- Список опросов -->
            <section>
                <h2>Список опросов (12)</h2>
                <ul class="cards" id="survey-cards">
                    <!-- Карточки будут добавлены через JavaScript -->
                </ul>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос».</p></div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
