<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Контакты сервиса «Статопрос»: адрес, телефон, режим работы и форма обратной связи.">
    <title>Контакты — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html">
                <img src="logo.svg" alt="Статопрос — сервис опросов" width="190" height="40">
            </a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html">Опросы</a></li>
                    <li><a class="nav__link" href="survey.html">Пример опроса</a></li>
                    <li><a class="nav__link" href="create.html">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html" aria-current="page">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="container">
            <h1>Контакты</h1>

            <div class="two-col">
                <!-- Блок с контактной информацией -->
                <section class="panel">
                    <h2>Как нас найти</h2>
                    <ul class="contact-list">
                        <!-- Здесь указан только город и страна -->
                        <li><strong>Адрес:</strong> Россия, Санкт-Петербург</li>
                        <li><strong>Телефон:</strong> <a href="tel:+78120000000">+7 (812) 000-00-00</a></li>
                        <li><strong>Почта:</strong> <a href="mailto:info@statopros.example">info@statopros.example</a></li>
                        <li><strong>Режим работы:</strong> пн–пт, 9:00–18:00</li>
                    </ul>
                    <p class="slogan">Каждый голос важен.</p>
                </section>

                <!-- Блок с формой обратной связи -->
                <section class="panel">
                    <h2>Обратная связь</h2>
                    <form action="contacts.html" method="get">
                        <div class="field">
                            <label for="name">Имя</label>
                            <input type="text" id="name" name="name" autocomplete="name" required>
                        </div>
                        <div class="field">
                            <label for="email">Электронная почта</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="message">Сообщение</label>
                            <textarea id="message" name="message" required></textarea>
                        </div>
                        <button class="btn" type="submit">Отправить</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p>© 2026 «Статопрос».</p>
        </div>
    </footer>
    <script src="main.js"></script>
</body>
</html>
