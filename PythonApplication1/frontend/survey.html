<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Прохождение опроса на сайте «Статопрос».">
    <meta name="theme-color" content="#0f766e">
    <title>Опрос — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html" aria-label="Статопрос — главная страница">
                <img src="logo.svg" alt="Статопрос" width="160" height="40">
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html">Опросы</a></li>
                    <li><a class="nav__link" href="create.html">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                    <li><a class="nav__link" href="login.html" id="auth-link">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div class="container">
            <article>
                <h1 id="survey-title">Загрузка...</h1>

                <div class="survey">
                    <div>
                        <div class="survey__cover">
                            <img id="survey-cover" alt="" width="640" height="360" hidden>
                        </div>
                        <h2>Об опросе</h2>
                        <p id="survey-description">Загрузка описания...</p>
                        <dl class="facts">
                            <dt>Автор</dt>
                            <dd id="survey-author">...</dd>
                        </dl>
                        <p><a class="btn btn--ghost" href="catalog.html">Вернуться к опросам</a></p>
                    </div>

                    <div>
                        <form class="panel" id="survey-form" novalidate>
                            <h2 id="survey-form-title">Ваши ответы</h2>
                            <div id="questions-container" aria-live="polite">
                                <p>Загрузка вопросов...</p>
                            </div>
                            <p id="survey-message" class="status" role="status" aria-live="polite"></p>
                            <button class="btn" id="survey-submit" type="submit" style="margin-top: 1rem;">Проголосовать</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос». Учебный проект.</p></div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
