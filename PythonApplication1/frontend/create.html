<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать опрос — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html"><img src="logo.svg" alt="Статопрос" width="160" height="40"></a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html">Опросы</a></li>
                    <li><a class="nav__link" href="survey.html">Пример опроса</a></li>
                    <li><a class="nav__link" href="create.html" aria-current="page">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" class="main-content">
        <div class="container">
            <h1>Создать опрос</h1>
            <p>Заполните форму, и опрос появится в списке.</p>

            <div class="two-col">
                <section class="panel">
                    <h2>Новый опрос</h2>
                    <form id="create-survey-form" action="create.html" method="get">
                        <div class="field"><label for="title">Название опроса *</label><input type="text" id="title" name="title" placeholder="Например: Как вы добираетесь до университета?" minlength="3" maxlength="150" autocomplete="off" required></div>
                        <div class="field"><label for="description">Описание *</label><textarea id="description" name="description" placeholder="Кратко объясните цель опроса." minlength="5" maxlength="2000" rows="5" required></textarea></div>
                        <div class="field"><label for="new-category">Рубрика *</label><select id="new-category" name="category" required><option value="study">Учёба</option><option value="life">Быт</option><option value="leisure">Досуг</option><option value="tech">Технологии</option></select></div>
                        <fieldset>
                            <legend>Варианты ответа</legend>
                            <div class="field"><label for="opt1">Вариант 1 *</label><input type="text" id="opt1" name="option1" placeholder="Введите первый вариант" maxlength="200" required></div>
                            <div class="field"><label for="opt2">Вариант 2 *</label><input type="text" id="opt2" name="option2" placeholder="Введите второй вариант" maxlength="200" required></div>
                            <div class="field"><label for="opt3">Вариант 3 (необязательно)</label><input type="text" id="opt3" name="option3" placeholder="Введите третий вариант" maxlength="200"></div>
                            <div class="field"><label for="opt4">Вариант 4 (необязательно)</label><input type="text" id="opt4" name="option4" placeholder="Введите четвёртый вариант" maxlength="200"></div>
                        </fieldset>
                        <div class="field"><label for="end-date">Дата окончания (необязательно)</label><input type="date" id="end-date" name="end_date"></div>
                        <p id="create-form-message" role="status" aria-live="polite"></p>
                        <div class="btn-row">
                            <button class="btn" type="submit">Подготовить опрос</button>
                            <button class="btn btn--ghost" type="reset">Очистить форму</button>
                        </div>
                    </form>
                </section>

                <aside>
                    <section class="panel">
                        <h2>Сводка за 30 дней</h2>
                        <dl class="stats">
                            <div><dt>Опросов</dt><dd>5</dd></div>
                            <div><dt>Ответов</dt><dd>1 324</dd></div>
                            <div><dt>В среднем на опрос</dt><dd>265</dd></div>
                        </dl>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос».</p></div>
    </footer>
    <script src="main.js"></script>
    <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const form = document.getElementById("create-survey-form");
                    const message = document.getElementById("create-form-message");
                    const dateInput = document.getElementById("end-date");

                    const today = new Date();
                    const localToday = [
                        today.getFullYear(),
                        String(today.getMonth() + 1).padStart(2, "0"),
                        String(today.getDate()).padStart(2, "0")
                    ].join("-");
                    dateInput.min = localToday;

                    form.addEventListener("submit", (event) => {
                        event.preventDefault();
                        const title = document.getElementById("title").value.trim();
                        const description = document.getElementById("description").value.trim();
                        const optionInputs = [document.getElementById("opt1"), document.getElementById("opt2"), document.getElementById("opt3"), document.getElementById("opt4")];
                        const options = optionInputs.map(input => input.value.trim()).filter(Boolean);

                        if (title.length < 3) { message.textContent = "Название должно содержать не менее 3 символов."; message.style.color = "var(--danger)"; return; }
                        if (description.length < 5) { message.textContent = "Добавьте более подробное описание опроса."; message.style.color = "var(--danger)"; return; }
                        if (options.length < 2) { message.textContent = "Укажите не менее двух вариантов ответа."; message.style.color = "var(--danger)"; return; }
                        const normalizedOptions = options.map(option => option.toLocaleLowerCase("ru"));
                        if (new Set(normalizedOptions).size !== options.length) { message.textContent = "Варианты ответов не должны повторяться."; message.style.color = "var(--danger)"; return; }
                        if (dateInput.value && dateInput.value < localToday) { message.textContent = "Дата окончания не может быть в прошлом."; message.style.color = "var(--danger)"; return; }
                        message.textContent = "Форма заполнена правильно. Для публикации необходимо подключить сервер.";
                        message.style.color = "var(--success)";
                    });

                    form.addEventListener("reset", () => { message.textContent = ""; });
                });
    </script>
</body>
</html>
