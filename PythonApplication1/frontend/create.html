<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать опрос — Статопрос</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="index.html"><img src="logo.svg" alt="Статопрос" width="160" height="40"></a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="catalog.html">Опросы</a></li>
                    <li><a class="nav__link" href="create.html" aria-current="page">Создать опрос</a></li>
                    <li><a class="nav__link" href="contacts.html">Контакты</a></li>
                    <li><a class="nav__link" href="login.html" id="auth-link">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content">
        <div class="container">
            <h1>Создать опрос</h1>
            <p>Заполните форму, и опрос появится в списке.</p>

            <div class="two-col">
                <section class="panel">
                    <h2>Новый опрос</h2>
                    <form id="create-survey-form">
                        <div class="field">
                            <label for="title">Название опроса *</label>
                            <input type="text" id="title" name="title" placeholder="Например: Как вы добираетесь до университета?" minlength="3" maxlength="150" autocomplete="off" required>
                        </div>
                        <div class="field">
                            <label for="description">Описание *</label>
                            <textarea id="description" name="description" placeholder="Кратко объясните цель опроса." minlength="5" maxlength="2000" rows="5" required></textarea>
                        </div>
                        <fieldset>
                            <legend>Варианты ответа</legend>
                            <div class="field">
                                <label for="opt1">Вариант 1 *</label>
                                <input type="text" id="opt1" name="option1" placeholder="Введите первый вариант" maxlength="200" required>
                            </div>
                            <div class="field">
                                <label for="opt2">Вариант 2 *</label>
                                <input type="text" id="opt2" name="option2" placeholder="Введите второй вариант" maxlength="200" required>
                            </div>
                            <div class="field">
                                <label for="opt3">Вариант 3 (необязательно)</label>
                                <input type="text" id="opt3" name="option3" placeholder="Введите третий вариант" maxlength="200">
                            </div>
                        </fieldset>
                        <p id="create-form-message" role="status" aria-live="polite"></p>
                        <div class="btn-row">
                            <button class="btn" type="submit">Опубликовать опрос</button>
                            <button class="btn btn--ghost" type="reset">Очистить форму</button>
                        </div>
                    </form>
                </section>

                <aside>
                    <section class="panel">
                        <h2>Сводка за 30 дней</h2>
                        <dl class="stats">
                            <div><dt>Опросов</dt><dd>5</dd></div>
                            <div><dt>Ответов</dt><dd>1 324</dd></div>
                            <div><dt>В среднем на опрос</dt><dd>265</dd></div>
                        </dl>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>© 2026 «Статопрос».</p></div>
    </footer>

    <script src="main.js"></script>
    <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const form = document.getElementById("create-survey-form");
                    const message = document.getElementById("create-form-message");

                    form.addEventListener("submit", async (event) => {
                        event.preventDefault();
                        const title = document.getElementById("title").value.trim();
                        const description = document.getElementById("description").value.trim();
                        const optionInputs = [document.getElementById("opt1"), document.getElementById("opt2"), document.getElementById("opt3")];
                        const options = optionInputs.map(input => input.value.trim()).filter(Boolean);

                        if (title.length < 3) { message.textContent = "Название должно содержать не менее 3 символов."; message.style.color = "var(--danger)"; return; }
                        if (description.length < 5) { message.textContent = "Добавьте более подробное описание опроса."; message.style.color = "var(--danger)"; return; }
                        if (options.length < 2) { message.textContent = "Укажите не менее двух вариантов ответа."; message.style.color = "var(--danger)"; return; }

                        try {
                            const response = await fetch('/api/surveys', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title: title, description: description, author_id: 1 })
                            });
                            if (!response.ok) throw new Error('Ошибка сервера');
                            message.textContent = "Опрос успешно создан!";
                            message.style.color = "var(--success)";
                            form.reset();
                            setTimeout(() => { window.location.href = "catalog.html"; }, 2000);
                        } catch (error) {
                            message.textContent = "Ошибка при создании опроса. Проверьте сервер.";
                            message.style.color = "var(--danger)";
                        }
                    });
                    form.addEventListener("reset", () => { message.textContent = ""; });
                });
    </script>
</body>
</html>
